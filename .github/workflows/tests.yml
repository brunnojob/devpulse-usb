name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install ruff==0.17.2
      - run: ruff check .
      - run: ruff format --check .
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: node --check assets/site.js
      - run: g++ -std=c++11 -Wall -Wextra -Werror -fsanitize=address,undefined tests/framer_test.cpp -o /tmp/framer-test
      - run: /tmp/framer-test
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.3.1'
      - run: arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - run: arduino-cli core install esp32:esp32@3.3.2 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - run: arduino-cli lib install 'ArduinoJson@7.4.2' 'Adafruit ST7735 and ST7789 Library@1.11.0'
      - run: python3 tools/check_firmware.py
